<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- HOME PAGE -->
    <div id="homePage" class="page active">
        <div class="home-container">
            <h1>👋 Welcome!</h1>
            <p>Explore my professional certifications and achievements</p>
            <div class="button-group">
                <button class="main-button btn-primary" onclick="showPage('certPage')">
                    📜 View Certifications
                </button>
            </div>
        </div>
    </div>
    
    <!-- CERTIFICATIONS PAGE -->
    <div id="certPage" class="page cert-page">
        <div class="page-header">
            <button class="back-button" onclick="showPage('homePage')">← Back to Home</button>
            <h1>My Certifications</h1>
            <p>Professional Achievements & Skills</p>
        </div>
        
        <div id="certificationsGrid" class="certifications-grid">
            <!-- Certifications will be loaded here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
